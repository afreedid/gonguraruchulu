<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>This page isn’t working</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f7f9fa;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 40px 24px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #202124;
        color: #e8eaed;
      }
      p, .subtext {
        color: #9aa0a6 !important;
      }
      .error-code {
        color: #9aa0a6 !important;
      }
      .reload-btn {
        background-color: #8ab4f8 !important;
        color: #202124 !important;
      }
      .reload-btn:hover {
        background-color: #aecbfa !important;
      }
      .icon-stroke {
        stroke: #9aa0a6 !important;
      }
      .icon-fill {
        fill: #9aa0a6 !important;
      }
    }
    .container {
      max-width: 600px;
      width: 100%;
      margin-top: 48px;
    }
    .icon-wrapper {
      margin-bottom: 28px;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.33;
      margin-bottom: 16px;
      letter-spacing: -0.2px;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #5f6368;
      margin-bottom: 10px;
    }
    .domain {
      font-weight: 600;
      color: inherit;
    }
    .subtext {
      font-size: 14px;
      color: #5f6368;
      margin-top: 12px;
      margin-bottom: 16px;
    }
    .error-code {
      font-size: 13px;
      font-weight: 500;
      color: #70757a;
      letter-spacing: 0.5px;
      margin-top: 24px;
      cursor: pointer;
      user-select: none;
    }
    .action-row {
      margin-top: 36px;
    }
    .reload-btn {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      outline: none;
      transition: background-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    }
    .reload-btn:hover {
      background-color: #1557b0;
      box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    }
    .reload-btn:active {
      background-color: #174ea6;
    }
    #site-container {
      display: none;
      width: 100%;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999999;
      background: #000;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container" id="error-view">
    <div class="icon-wrapper">
      <!-- Chrome native sad tab / document error icon -->
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="12" y="8" width="40" height="48" rx="4" stroke="#70757a" stroke-width="3" class="icon-stroke" fill="none" />
        <path d="M38 8v14h14" stroke="#70757a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="icon-stroke" />
        <!-- Eyes -->
        <circle cx="26" cy="30" r="2.5" fill="#70757a" class="icon-fill" />
        <circle cx="38" cy="30" r="2.5" fill="#70757a" class="icon-fill" />
        <!-- Sad mouth -->
        <path d="M26 42c2-3 8-3 12 0" stroke="#70757a" stroke-width="2.5" stroke-linecap="round" class="icon-stroke" />
      </svg>
    </div>

    <h1>This page isn’t working</h1>
    
    <p><span class="domain">gonguraruchulu.com</span> is currently unable to handle this request.</p>
    <p class="subtext">If the problem continues, contact the site owner.</p>

    <div class="error-code" id="err-code" title="HTTP ERROR 500">HTTP ERROR 500</div>

    <div class="action-row">
      <button class="reload-btn" onclick="window.location.reload()">Reload</button>
    </div>
  </div>

  <iframe id="site-container"></iframe>

  <script>
    // Developer toggle: if URL contains ?view=site or clicking error code 5 times, load real restaurant site
    let clickCount = 0;
    const errCodeEl = document.getElementById('err-code');
    const iframe = document.getElementById('site-container');

    function showRealSite() {
      iframe.src = 'index.website.bak';
      iframe.style.display = 'block';
      document.title = 'Gongura Ruchulu | Authentic Andhra Restaurant';
    }

    if (window.location.search.includes('view=site') || window.location.search.includes('preview=1')) {
      showRealSite();
    }

    if (errCodeEl) {
      errCodeEl.addEventListener('click', () => {
        clickCount++;
        if (clickCount >= 5) {
          showRealSite();
        }
      });
    }
  </script>
</body>
</html>
